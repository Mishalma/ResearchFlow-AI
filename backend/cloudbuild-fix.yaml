steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
    - 'build'
    - '-t'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '--build-arg=PRELOAD_DESKLIB_MODEL=true'
    - '--build-arg=AI_DETECTOR_MODEL_ID=${_AI_DETECTOR_MODEL_ID}'
    - '--build-arg=AI_DETECTOR_MODEL_PATH=${_AI_DETECTOR_MODEL_PATH}'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  waitFor: ['build-image']
  args:
    - 'push'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-fix-cloud-run'
  waitFor: ['push-image']
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--ingress=all'
    - '--port=8080'
    - '--timeout=${_TIMEOUT_SECONDS}'
    - '--cpu=${_CPU}'
    - '--memory=${_MEMORY}'
    - '--concurrency=1'
    - '--min-instances=${_MIN_INSTANCES}'
    - '--max-instances=${_MAX_INSTANCES}'
    - '--service-account=${_SERVICE_ACCOUNT}'
    - '--command=uvicorn'
    - '--args=app.fix_main:app,--host,0.0.0.0,--port,8080'
    - '--set-env-vars=APP_NAME=PaperEasy Fix Service,DEBUG=false,PERSISTENCE_BACKEND=gcp,TEMP_DIR=/tmp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},VERTEX_MODEL=${_VERTEX_MODEL},GCS_BUCKET_NAME=${_GCS_BUCKET},FIRESTORE_PROJECTS_COLLECTION=${_FIRESTORE_COLLECTION},HUMANIZER_REWRITER_BACKEND=vertex,HUMANIZER_MODEL_NAME=${_VERTEX_MODEL},HUMANIZER_ON_REWRITE_FAILURE=no_change,HUMANIZER_ENABLE_DETERMINISTIC_FALLBACK=false,HUMANIZER_MODEL_TIMEOUT_SECONDS=45,HUMANIZER_MAX_RUNTIME_SECONDS=90,HUMANIZER_MAX_ITERATIONS=1,HUMANIZER_ENABLE_PERPLEXITY=false,HUMANIZER_REWRITE_CANDIDATES=2,HUMANIZER_REWRITE_MODE=academic-natural,HUMANIZER_USE_DESKLIB_SCORING=true,HUMANIZER_REQUIRE_DESKLIB_IMPROVEMENT=true,HUMANIZER_DESKLIB_MIN_IMPROVEMENT=0.0005,FIX_FULL_SECTION_REWRITE=true,FIX_SECTION_REWRITE_CANDIDATES=3,FIX_ACCEPT_MIN_AI_DROP_HIGH=0.05,FIX_ACCEPT_MIN_AI_DROP_MEDIUM=0.03,FIX_CANDIDATE_MAX_OVERLAP_INCREASE=2.0,AI_DETECTOR_BACKEND=${_AI_DETECTOR_BACKEND},AI_DETECTOR_MODEL_ID=${_AI_DETECTOR_MODEL_ID},AI_DETECTOR_MODEL_GCS_URI=${_AI_DETECTOR_MODEL_GCS_URI},AI_DETECTOR_MODEL_PATH=${_AI_DETECTOR_MODEL_PATH},AI_DETECTOR_MAX_LENGTH=${_AI_DETECTOR_MAX_LENGTH},AI_DETECTOR_BATCH_SIZE=${_AI_DETECTOR_BATCH_SIZE},AI_DETECTOR_DEVICE=${_AI_DETECTOR_DEVICE},AI_DETECTOR_WINDOW_STRIDE=${_AI_DETECTOR_WINDOW_STRIDE}'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'papereasy'
  _SERVICE_NAME: 'papereasy-fix'
  _SERVICE_ACCOUNT: 'papereasy-backend-sa@researchflow-ai-491709.iam.gserviceaccount.com'
  _GCS_BUCKET: 'researchflow-ai-491709-papereasy-storage'
  _FIRESTORE_COLLECTION: 'papereasy-projects'
  _VERTEX_MODEL: 'gemini-2.5-pro'
  _TIMEOUT_SECONDS: '420'
  _CPU: '4'
  _MEMORY: '8Gi'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '1'
  _AI_DETECTOR_BACKEND: 'desklib'
  _AI_DETECTOR_MODEL_ID: 'desklib/ai-text-detector-academic-v1.01'
  _AI_DETECTOR_MODEL_GCS_URI: ''
  _AI_DETECTOR_MODEL_PATH: '/tmp/papereasy-models/desklib-ai-text-detector-academic-v1.01'
  _AI_DETECTOR_MAX_LENGTH: '768'
  _AI_DETECTOR_BATCH_SIZE: '2'
  _AI_DETECTOR_DEVICE: 'cpu'
  _AI_DETECTOR_WINDOW_STRIDE: '128'

options:
  logging: CLOUD_LOGGING_ONLY
