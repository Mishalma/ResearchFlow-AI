steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
    - 'build'
    - '-t'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  waitFor: ['build-image']
  args:
    - 'push'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-cloud-run'
  waitFor: ['push-image']
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--port=8080'
    - '--service-account=${_SERVICE_ACCOUNT}'
    - '--set-env-vars=APP_NAME=PaperEasy Backend,DEBUG=false,PERSISTENCE_BACKEND=gcp,TEMP_DIR=/tmp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},VERTEX_MODEL=${_VERTEX_MODEL},GCS_BUCKET_NAME=${_GCS_BUCKET},FIRESTORE_PROJECTS_COLLECTION=${_FIRESTORE_COLLECTION},FIRESTORE_JOBS_COLLECTION=${_JOBS_COLLECTION},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},WORKFLOW_GENERATION_BACKEND=${_WORKFLOW_GENERATION_BACKEND},GENERATION_SERVICE_BASE_URL=${_GENERATION_SERVICE_BASE_URL},GENERATION_SERVICE_AUDIENCE=${_GENERATION_SERVICE_AUDIENCE},GENERATION_SERVICE_TIMEOUT_SECONDS=${_GENERATION_SERVICE_TIMEOUT_SECONDS},WORKFLOW_VALIDATION_BACKEND=${_WORKFLOW_VALIDATION_BACKEND},VALIDATION_SERVICE_BASE_URL=${_VALIDATION_SERVICE_BASE_URL},VALIDATION_SERVICE_AUDIENCE=${_VALIDATION_SERVICE_AUDIENCE},VALIDATION_SERVICE_TIMEOUT_SECONDS=${_VALIDATION_SERVICE_TIMEOUT_SECONDS},WRITING_USE_MODEL_GENERATOR=false,WRITING_ENABLE_DIVERSITY_PASS=false,HUMANIZER_ENABLE_PERPLEXITY=false,HUMANIZER_MAX_ITERATIONS=1,HUMANIZER_USE_MODEL_REWRITER=false,CITATION_MAX_CLAIMS_PER_SECTION=1,CITATION_MAX_QUERIES_PER_CLAIM=1,CITATION_MAX_PARALLEL_CLAIMS=2,CITATION_PROVIDER_RESULT_LIMIT=4,AGENT_RETRY_ATTEMPTS=1'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'papereasy'
  _SERVICE_NAME: 'papereasy-backend'
  _SERVICE_ACCOUNT: ''
  _GCS_BUCKET: ''
  _FIRESTORE_COLLECTION: 'papereasy-projects'
  _JOBS_COLLECTION: 'papereasy-jobs'
  _ALLOWED_ORIGINS: 'http://localhost:3000'
  _VERTEX_MODEL: 'gemini-2.5-flash'
  _WORKFLOW_GENERATION_BACKEND: 'local'
  _GENERATION_SERVICE_BASE_URL: ''
  _GENERATION_SERVICE_AUDIENCE: ''
  _GENERATION_SERVICE_TIMEOUT_SECONDS: '1500'
  _WORKFLOW_VALIDATION_BACKEND: 'local'
  _VALIDATION_SERVICE_BASE_URL: ''
  _VALIDATION_SERVICE_AUDIENCE: ''
  _VALIDATION_SERVICE_TIMEOUT_SECONDS: '120'

options:
  logging: CLOUD_LOGGING_ONLY


