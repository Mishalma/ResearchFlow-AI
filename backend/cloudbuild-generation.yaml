steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
    - 'build'
    - '-t'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  waitFor: ['build-image']
  args:
    - 'push'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-generation-cloud-run'
  waitFor: ['push-image']
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--ingress=all'
    - '--port=8080'
    - '--timeout=1800'
    - '--cpu=1'
    - '--memory=2Gi'
    - '--service-account=${_SERVICE_ACCOUNT}'
    - '--command=uvicorn'
    - '--args=app.generation_main:app,--host,0.0.0.0,--port,8080'
    - '--set-env-vars=APP_NAME=PaperEasy Generation Service,DEBUG=false,PERSISTENCE_BACKEND=gcp,TEMP_DIR=/tmp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},VERTEX_MODEL=${_VERTEX_MODEL},GCS_BUCKET_NAME=${_GCS_BUCKET},FIRESTORE_PROJECTS_COLLECTION=${_FIRESTORE_COLLECTION},WORKFLOW_VALIDATION_BACKEND=${_WORKFLOW_VALIDATION_BACKEND},VALIDATION_SERVICE_BASE_URL=${_VALIDATION_SERVICE_BASE_URL},VALIDATION_SERVICE_AUDIENCE=${_VALIDATION_SERVICE_AUDIENCE},VALIDATION_SERVICE_TIMEOUT_SECONDS=${_VALIDATION_SERVICE_TIMEOUT_SECONDS},GENERATION_SECTION_GATE_ENABLED=true,SECTION_GATE_AI_THRESHOLD=0.10,SECTION_GATE_ORDER=introduction;related_work;methodology;results;discussion;limitations;conclusion;abstract,SECTION_GATE_WRITING_CANDIDATES=2,SECTION_GATE_HUMANIZER_CANDIDATES=2,SECTION_GATE_ABSTRACT_WRITING_CANDIDATES=4,SECTION_GATE_ABSTRACT_HUMANIZER_CANDIDATES=4,SECTION_GATE_MODEL_TIMEOUT_SECONDS=45,SECTION_GATE_ABSTRACT_TIMEOUT_SECONDS=75,SECTION_GATE_STRATEGIES=evidence_section;detector_feedback,GENERATION_PREFLIGHT_SCORING=false,WRITING_USE_MODEL_GENERATOR=true,WRITING_ENABLE_DIVERSITY_PASS=true,HUMANIZER_REWRITER_BACKEND=vertex,HUMANIZER_MODEL_NAME=gemini-2.5-pro,HUMANIZER_ON_REWRITE_FAILURE=no_change,HUMANIZER_ENABLE_DETERMINISTIC_FALLBACK=false,HUMANIZER_MODEL_TIMEOUT_SECONDS=75,HUMANIZER_MAX_RUNTIME_SECONDS=75,FIX_FULL_SECTION_REWRITE=true,FIX_SECTION_REWRITE_CANDIDATES=2,CITATION_MAX_CLAIMS_PER_SECTION=1,CITATION_MAX_QUERIES_PER_CLAIM=1,CITATION_MAX_PARALLEL_CLAIMS=2,CITATION_PROVIDER_RESULT_LIMIT=4,AGENT_RETRY_ATTEMPTS=1,STRUCTURING_USE_LLM_REDUCER=true'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'papereasy'
  _SERVICE_NAME: 'papereasy-generation'
  _SERVICE_ACCOUNT: 'papereasy-backend-sa@researchflow-ai-491709.iam.gserviceaccount.com'
  _GCS_BUCKET: 'researchflow-ai-491709-papereasy-storage'
  _FIRESTORE_COLLECTION: 'papereasy-projects'
  _VERTEX_MODEL: 'gemini-2.5-flash'
  _WORKFLOW_VALIDATION_BACKEND: 'service'
  _VALIDATION_SERVICE_BASE_URL: 'https://papereasy-validation-wppyhczzqa-uc.a.run.app'
  _VALIDATION_SERVICE_AUDIENCE: 'https://papereasy-validation-wppyhczzqa-uc.a.run.app'
  _VALIDATION_SERVICE_TIMEOUT_SECONDS: '600'

options:
  logging: CLOUD_LOGGING_ONLY
