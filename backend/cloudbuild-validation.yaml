steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-image'
  args:
    - 'build'
    - '-t'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: 'push-image'
  waitFor: ['build-image']
  args:
    - 'push'
    - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-validation-cloud-run'
  waitFor: ['push-image']
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--ingress=all'
    - '--port=8080'
    - '--timeout=180'
    - '--cpu=${_CPU}'
    - '--memory=${_MEMORY}'
    - '--gpu=${_GPU_COUNT}'
    - '--gpu-type=${_GPU_TYPE}'
    - '--no-cpu-throttling'
    - '--concurrency=${_CONCURRENCY}'
    - '--min-instances=${_MIN_INSTANCES}'
    - '--max=${_MAX_INSTANCES}'
    - '--max-instances=${_MAX_INSTANCES}'
    - '--service-account=${_SERVICE_ACCOUNT}'
    - '--command=uvicorn'
    - '--args=^|^app.validation_main:app|--host|0.0.0.0|--port|8080'
    - '--set-env-vars=^|^APP_NAME=PaperEasy Validation Service|DEBUG=false|PERSISTENCE_BACKEND=gcp|TEMP_DIR=/tmp|GOOGLE_CLOUD_PROJECT=$PROJECT_ID|GOOGLE_CLOUD_LOCATION=${_REGION}|VERTEX_MODEL=${_VERTEX_MODEL}|GCS_BUCKET_NAME=${_GCS_BUCKET}|FIRESTORE_PROJECTS_COLLECTION=${_FIRESTORE_COLLECTION}|AI_DETECTOR_BACKEND=${_AI_DETECTOR_BACKEND}|AI_DETECTOR_MODEL_ID=${_AI_DETECTOR_MODEL_ID}|AI_DETECTOR_MODEL_GCS_URI=${_AI_DETECTOR_MODEL_GCS_URI}|AI_DETECTOR_MODEL_PATH=${_AI_DETECTOR_MODEL_PATH}|AI_DETECTOR_MAX_LENGTH=${_AI_DETECTOR_MAX_LENGTH}|AI_DETECTOR_BATCH_SIZE=${_AI_DETECTOR_BATCH_SIZE}|AI_DETECTOR_DEVICE=${_AI_DETECTOR_DEVICE}|AI_DETECTOR_WINDOW_STRIDE=${_AI_DETECTOR_WINDOW_STRIDE}'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'papereasy'
  _SERVICE_NAME: 'papereasy-validation'
  _SERVICE_ACCOUNT: ''
  _GCS_BUCKET: ''
  _FIRESTORE_COLLECTION: 'papereasy-projects'
  _VERTEX_MODEL: 'gemini-2.5-flash'
  _CPU: '4'
  _MEMORY: '16Gi'
  _GPU_COUNT: '1'
  _GPU_TYPE: 'nvidia-l4'
  _CONCURRENCY: '4'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '1'
  _AI_DETECTOR_BACKEND: 'desklib'
  _AI_DETECTOR_MODEL_ID: 'desklib/ai-text-detector-academic-v1.01'
  _AI_DETECTOR_MODEL_GCS_URI: ''
  _AI_DETECTOR_MODEL_PATH: '/tmp/papereasy-models/desklib-ai-text-detector-academic-v1.01'
  _AI_DETECTOR_MAX_LENGTH: '768'
  _AI_DETECTOR_BATCH_SIZE: '8'
  _AI_DETECTOR_DEVICE: 'auto'
  _AI_DETECTOR_WINDOW_STRIDE: '128'

options:
  logging: CLOUD_LOGGING_ONLY
